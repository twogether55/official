<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1b1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hushline — private messenger</title>
<meta name="description" content="End-to-end encrypted chat, voice messages, photos and calls. No phone number. No email.">

<!-- PeerJS: peer-to-peer WebRTC (jsDelivr first, unpkg as a fallback) -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js';document.head.appendChild(s);"></script>

<style>
/* ============================== THEME ============================== */
:root{
  --accent:#00f782; --accent-soft:rgba(0,247,130,.14); --on-accent:#08130d;
  --danger:#ff453a; --warn:#ffb020; --ok:#31d158;
}
[data-theme="dark"]{
  --bg:#141414; --rail:#101010; --panel:#1b1b1b; --panel-2:#242424; --line:#2c2c2c;
  --text:#f3f3f3; --dim:#a4a4a4; --faint:#6e6e6e;
  --bubble-in:#2d2d2d; --bubble-out:#00f782; --text-out:#08130d;
  --hover:rgba(255,255,255,.06); --overlay:rgba(0,0,0,.62); --field:#262626;
}
[data-theme="light"]{
  --bg:#ffffff; --rail:#f1f1f1; --panel:#f8f8f8; --panel-2:#ffffff; --line:#e4e4e4;
  --text:#121212; --dim:#5f5f5f; --faint:#9a9a9a;
  --bubble-in:#ececec; --bubble-out:#00f782; --text-out:#08130d;
  --hover:rgba(0,0,0,.05); --overlay:rgba(0,0,0,.4); --field:#ededed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Public Sans",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.dim{color:var(--dim)} .faint{color:var(--faint)}
svg{display:block;flex:none}
/* keyboard focus is always visible; mouse/touch focus stays quiet */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.inp:focus-visible,.search input:focus-visible,.composer textarea:focus-visible{outline:none}
a.iconbtn,a.srow,a.btn{text-decoration:none}
a.srow{color:inherit}

/* ============================== APP SHELL ============================== */
#app{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100dvh);display:grid;grid-template-columns:76px 350px minmax(0,1fr);background:var(--bg)}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px}
.rail .spacer{flex:1}
.rbtn{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--dim);transition:background .15s,color .15s}
.rbtn:hover{background:var(--hover);color:var(--text)}
.rbtn.on{color:var(--on-accent);background:var(--accent)}
.badge{position:absolute;top:1px;right:-1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--rail)}
.rail-avatar{margin-bottom:10px}

.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.phead{padding:18px 16px 8px 20px;display:flex;align-items:center;gap:10px}
.phead h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em}
.netline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);margin-top:2px}
.netline i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.netline.ok i{background:var(--ok)} .netline.wait i{background:var(--warn)} .netline.bad i{background:var(--danger)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--dim);transition:.15s}
.iconbtn:hover{background:var(--hover);color:var(--text)}
.iconbtn.accent{background:var(--accent);color:var(--on-accent)}
.search{margin:6px 14px 8px;display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:0 12px;color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;padding:11px 0;color:var(--text)}
.plist{flex:1;overflow-y:auto;padding:4px 8px 16px;min-height:0}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:14px;transition:background .12s}
.item:hover{background:var(--hover)} .item.on{background:var(--accent-soft)}
.imain{flex:1;min-width:0}
.irow{display:flex;align-items:center;gap:8px}
.iname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}
.itime{font-size:12px;color:var(--faint);flex:none}
.iprev{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;color:var(--dim)}
.ubadge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:800;display:grid;place-items:center}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
[data-theme="light"] .tag{color:#008a49}
.sect{padding:14px 12px 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.emptybox{padding:48px 24px;text-align:center;color:var(--dim)}
.emptybox .big{width:72px;height:72px;border-radius:24px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 16px}
.emptybox h3{margin:0 0 6px;color:var(--text)}

/* avatar */
.avatar{position:relative;width:var(--s,44px);height:var(--s,44px);flex:none;border-radius:50%;
  background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(var(--h2) 58% 34%));color:#fff;display:grid;place-items:center;
  font-weight:700;font-size:calc(var(--s,44px)*.42);user-select:none}
.avatar .dot{position:absolute;right:-1px;bottom:-1px;width:28%;height:28%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}

/* buttons */
.btn{border-radius:12px;padding:12px 16px;font-weight:650;background:var(--field);color:var(--text);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:16px}.btnrow .btn{flex:1}

/* ============================== CHAT PANE ============================== */
.chatpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);position:relative}
.empty{margin:auto;text-align:center;padding:24px;max-width:360px}
.logo{width:84px;height:84px;border-radius:26px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 18px;box-shadow:0 18px 50px -14px rgba(0,247,130,.55)}
.empty h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.lockline{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);margin-top:14px;padding:6px 12px;border-radius:999px;background:var(--field)}
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.chead{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
.back{display:none}
.chead .who{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:2px 6px;border-radius:12px}
.chead .who:hover{background:var(--hover)}
.chead .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .st{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .st.on{color:var(--ok)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-size:14px}
.banner .btnrow{margin:0;flex:none}
.banner .btn{padding:8px 14px}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:3px;min-height:0;scroll-behavior:smooth}
.day{align-self:center;margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--dim);background:var(--field);padding:4px 12px;border-radius:999px}
.hint{margin:auto;text-align:center;color:var(--dim);max-width:280px;padding:24px}
.hint .lockline{margin-top:10px}
.row{display:flex;flex-direction:column}
.row.out{align-items:flex-end}.row.in{align-items:flex-start}
.bubble{position:relative;max-width:min(78%,540px);padding:8px 12px 6px;border-radius:19px;background:var(--bubble-in);word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;user-select:text;-webkit-user-select:text}
.row.out .bubble{background:var(--bubble-out);color:var(--text-out);border-bottom-right-radius:6px}
.row.in .bubble{border-bottom-left-radius:6px}
.bubble a{color:inherit;text-decoration:underline}
.bubble.media{padding:3px;overflow:hidden}
.bubble.media .bmeta{position:absolute;right:10px;bottom:8px;margin:0;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.5);color:#fff;opacity:1}
.bubble.deleted{background:transparent!important;border:1px dashed var(--line);color:var(--faint);font-style:italic}
.bmeta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;opacity:.68;margin-top:1px;white-space:normal}
.bubble img.pic{display:block;width:min(320px,68vw);max-height:400px;object-fit:cover;border-radius:16px;cursor:zoom-in;background:var(--field)}
.voice{display:flex;align-items:center;gap:10px;min-width:min(230px,60vw);padding:2px 2px 0}
.vplay{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.18);display:grid;place-items:center;flex:none}
.row.in .vplay{background:var(--accent);color:var(--on-accent)}
.vbar{flex:1;height:5px;border-radius:3px;background:rgba(127,127,127,.35);position:relative;cursor:pointer}
.vbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:currentColor}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.sys{align-self:center;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--dim);background:var(--field);padding:5px 12px;border-radius:999px;margin:6px 0}
.sys.miss{color:var(--danger)}

.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
.composer .field{flex:1;min-width:0;background:var(--field);border-radius:22px;display:flex;align-items:flex-end}
.composer textarea{flex:1;border:0;background:none;outline:none;resize:none;padding:11px 16px;max-height:132px;line-height:1.35;color:var(--text)}
.composer textarea::placeholder{color:var(--faint)}
.sendbtn{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .1s}
.sendbtn:active{transform:scale(.94)}
.recbar{flex:1;display:flex;align-items:center;gap:12px;background:var(--field);border-radius:22px;padding:0 6px 0 16px;height:46px}
.recbar .rd{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
.recbar .rt{font-variant-numeric:tabular-nums;font-weight:650}
.recbar .rl{flex:1;color:var(--faint);font-size:13px}
@keyframes pulse{50%{opacity:.25}}
.composer.recording .field,.composer.recording #btnImg,.composer.recording #btnMic{display:none}
.composer:not(.recording) .recbar{display:none}
.dropmask{position:absolute;inset:0;background:var(--accent-soft);border:2px dashed var(--accent);display:grid;place-items:center;font-weight:700;z-index:5;pointer-events:none}

/* ============================== MODALS ============================== */
.overlay{position:fixed;inset:0;z-index:150;background:var(--overlay);display:grid;place-items:center;padding:16px;animation:fade .15s}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:22px;width:min(460px,100%);max-height:88dvh;overflow:auto;padding:22px;animation:pop .18s ease}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p{margin:6px 0}
.sheet label{display:block;font-size:12.5px;font-weight:650;color:var(--dim);margin:14px 0 6px}
.inp{width:100%;background:var(--field);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;outline:none;color:var(--text)}
.inp:focus{border-color:var(--accent)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;line-height:1.5}
.idbox{background:var(--field);border-radius:12px;padding:12px 14px}
.menu{display:flex;flex-direction:column;margin:-6px -8px}
.menu button{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:12px;text-align:left;font-weight:550}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.snum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.snum span{background:var(--field);border-radius:8px;padding:8px 0;text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.center{text-align:center}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
@media (max-width:820px){
  .overlay{place-items:end center;padding:0}
  .sheet{width:100%;border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:slideup .22s ease}
  @keyframes slideup{from{transform:translateY(40px);opacity:0}}
}

.viewer{position:fixed;inset:0;z-index:170;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vt{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;display:flex;gap:8px}
.viewer .vt button{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}

#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--panel-2);color:var(--text);border:1px solid var(--line);padding:11px 16px;border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.4);font-size:14px;animation:tin .2s ease;text-align:center}
.toast.error{border-color:var(--danger)} .toast.ok{border-color:var(--accent)}
.toast.out{opacity:0;transform:translateY(-8px);transition:.3s}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* ============================== WELCOME ============================== */
.welcome{position:fixed;inset:0;z-index:100;background:radial-gradient(120% 80% at 50% 0%,rgba(0,247,130,.12),transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.wcard{width:min(420px,100%);text-align:center}
.wcard h1{font-size:34px;letter-spacing:-.03em;margin:8px 0 6px}
.wcard .tagline{color:var(--dim);margin:0 0 28px}
.wcard .btn{margin-top:10px}
.feat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
.feat span{font-size:12.5px;color:var(--dim);background:var(--field);padding:6px 12px;border-radius:999px;display:inline-flex;gap:6px;align-items:center}
.wcard .idbox{text-align:left;margin:14px 0}

/* settings */
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:16px;padding:6px;margin:6px 6px 14px}
.srow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;width:100%;text-align:left}
button.srow:hover,a.srow:hover{background:var(--hover)}
.srow .grow{flex:1;min-width:0}
.srow small{display:block;color:var(--dim);font-size:12.5px}
.srow.danger{color:var(--danger)}
.srow.apk{color:var(--accent)}
[data-theme="light"] .srow.apk{color:#008a49}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--accent)} .switch.on::after{left:21px}

/* ============================== ANDROID APP PROMO ==============================
   Shown ONLY in an Android browser. Never inside the Hushline Android app / WebView. */
.iconbtn.apk{position:relative;color:var(--accent);background:var(--accent-soft)}
[data-theme="light"] .iconbtn.apk{color:#008a49}
.iconbtn.apk::after{content:"";position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel);animation:pulse 1.6s infinite}
.apkcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent);border-radius:16px;padding:12px 14px;margin-top:22px;color:var(--text)}
.apkcard .ai{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.apkcard .at{flex:1;min-width:0}
.apkcard b{display:block}
.apkcard small{color:var(--dim)}
.promo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:320;width:min(360px,calc(100vw - 28px));background:var(--panel-2);color:var(--text);
  border:1px solid var(--accent);border-radius:22px;padding:22px 20px 18px;text-align:center;
  box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 6px var(--accent-soft);animation:promoIn .22s ease}
.promo .picon{width:60px;height:60px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 12px}
.promo h3{margin:0 0 6px;font-size:19px}
.promo p{margin:0 0 16px;color:var(--dim);font-size:14px}
.promo .pclose{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim)}
.promo .pclose:hover{background:var(--hover);color:var(--text)}
.promo .btn{display:flex;align-items:center;justify-content:center;gap:8px}
.promo .pnote{margin-top:10px;font-size:12px;color:var(--faint)}
@keyframes promoIn{from{opacity:0;transform:translate(-50%,-46%) scale(.96)}}
@media (max-height:460px){.promo{top:calc(50% - 24px);padding:14px}.promo .picon{display:none}}

/* ============================== CALL ============================== */
#call{position:fixed;left:0;top:0;width:100%;height:var(--app-h,100dvh);z-index:200;background:#000;color:#fff;display:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#call.on{display:block}
.stage{position:absolute;inset:0;background:#000;overflow:hidden}
.stage video{position:absolute;inset:0;width:100%;height:100%;background:#000}
#remoteBg{object-fit:cover;filter:blur(32px) brightness(.5);transform:scale(1.25)}
#remoteVideo{object-fit:contain}
#remoteVideo.fill{object-fit:cover}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:radial-gradient(circle at 50% 30%,#2a2a2a,#0b0b0b)}
.ph .pname{font-size:26px;font-weight:800;margin-top:10px;text-align:center;padding:0 24px}
.ph .psub{color:rgba(255,255,255,.65)}
.ph .ring{position:relative}
.ph .ring::before,.ph .ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px solid rgba(0,247,130,.45);animation:ripple 2s infinite}
.ph .ring::after{animation-delay:1s}
@keyframes ripple{from{transform:scale(.8);opacity:1}to{transform:scale(1.5);opacity:0}}
#call:not(.on-ph) .ph{display:none}
.pip{position:absolute;z-index:6;width:var(--pipw,112px);aspect-ratio:var(--pipar,3/4);border-radius:16px;overflow:hidden;border:2px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none;cursor:grab;background:#111;transition:left .2s,top .2s}
.pip.drag{transition:none;cursor:grabbing}
.pip video{width:100%;height:100%;object-fit:cover}
.pip.mirror video{transform:scaleX(-1)}
.ctop{position:absolute;left:0;right:0;top:0;z-index:7;padding:calc(12px + env(safe-area-inset-top)) 16px 30px;background:linear-gradient(#000a,#0000);display:flex;flex-direction:column;align-items:center;gap:2px;transition:opacity .25s;pointer-events:none}
.ctop .t{font-weight:700;font-size:17px;text-shadow:0 1px 8px #0008}
.ctop .s{font-size:14px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}
.ctop .lk{display:inline-flex;align-items:center;gap:5px;font-size:12px;margin-top:4px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.ctop .lk.ok{color:var(--accent)} .ctop .lk.warn{color:var(--warn)}
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:30px 12px calc(20px + env(safe-area-inset-bottom));background:linear-gradient(#0000,#000b);display:flex;justify-content:center;flex-wrap:wrap;gap:14px;transition:opacity .25s}
#call.hide-ui .ctop,#call.hide-ui .cbar{opacity:0;pointer-events:none}
.cbtn{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-items:center;color:#fff;transition:transform .1s,background .15s}
.cbtn:active{transform:scale(.92)}
.cbtn.off{background:#fff;color:#111}
.cbtn.end{background:var(--danger);width:66px}
.cbtn.end svg{transform:rotate(135deg)}
#incoming{position:fixed;inset:0;z-index:210;background:rgba(6,6,6,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;padding:24px;text-align:center;height:var(--app-h,100dvh)}
#incoming.on{display:flex}
#incoming .pname{font-size:28px;font-weight:800;margin-top:16px}
#incoming .psub{color:rgba(255,255,255,.65);margin-bottom:40px}
#incoming .ring{position:relative}
#incoming .ring::before,#incoming .ring::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px solid rgba(0,247,130,.5);animation:ripple 2s infinite}
#incoming .ring::after{animation-delay:1s}
.inrow{display:flex;gap:56px}
.inrow .cbtn{width:72px;height:72px}
.inrow .acc{background:var(--ok)} .inrow .dec{background:var(--danger)} .inrow .dec svg{transform:rotate(135deg)}

/* ============================== MOBILE ============================== */
@media (max-width:820px){
  #app{display:flex;flex-direction:column}
  .rail{order:2;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);gap:0}
  .rail .spacer,.rail-avatar{display:none}
  .rbtn{width:64px;height:46px}
  .badge{right:10px}
  .panel{order:1;flex:1;border-right:0;padding-top:env(safe-area-inset-top)}
  .chatpane{position:absolute;inset:0;z-index:30;transform:translateX(100%);transition:transform .22s ease;visibility:hidden}
  #app.chat-open .chatpane{transform:none;visibility:visible}
  .back{display:grid}
  .bubble{max-width:84%}
  .cbar{gap:10px}
  .cbtn{width:54px;height:54px}
}
@media (max-height:460px) and (orientation:landscape){
  .cbar{padding-top:12px;padding-bottom:10px} .cbtn{width:46px;height:46px} .ctop{padding-bottom:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const DB = (() => {
  let db;

    const r = indexedDB.open('hushline', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('friends', { keyPath: 'id' });
      const m = d.createObjectStore('messages', { keyPath: 'id' });
      m.createIndex('peer_ts', ['peer', 'ts']); m.createIndex('peer', 'peer');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const s = t.objectStore(store); let out;
    const rq = fn(s); if (rq) rq.onsuccess = () => { out = rq.result; };
    t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
  return {
    open,
    get: (s, k) => tx(s, 'readonly', o => o.get(k)),
    put: (s, v) => tx(s, 'readwrite', o => o.put(v)),
    del: (s, k) => tx(s, 'readwrite', o => o.delete(k)),
    all: s => tx(s, 'readonly', o => o.getAll()),
    msgs: peer => tx('messages', 'readonly', o => o.index('peer_ts').getAll(IDBKeyRange.bound([peer, 0], [peer, Infinity]))),
    delPeer: peer => new Promise((res, rej) => {

function appendMsg(m) {
  if (S.msgs.some(x => x.id === m.id)) return;
  S.msgs.push(m); S.msgs.sort((a, b) => a.ts - b.ts);
  const box = $('#msgs'); const hint = $('.hint', box); if (hint) hint.remove();
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 160 || m.dir === 'out';
  const prev = S.msgs[S.msgs.length - 2];
  if (!prev || dayKey(prev.ts) !== dayKey(m.ts)) box.append(h('div', { class: 'day' }, dayLabel(m.ts)));
  box.append(msgEl(m));
  if (near) box.scrollTop = box.scrollHeight;

function attachPress(el, fn) {

  el.addEventListener('touchmove', e => { const p = e.touches[0]; if (Math.abs(p.clientX - x) > 10 || Math.abs(p.clientY - y) > 10) { clearTimeout(t); t = null; } }, { passive: true });

async function commitOutgoing(m) {

async function buildFrame(m) {
  if (m.type === 'text') return { header: { k: 'msg', id: m.id, ts: m.ts, text: m.text } };
  const payload = new Uint8Array(await m.blob.arrayBuffer());
  if (m.type === 'image') return { header: { k: 'img', id: m.id, ts: m.ts, mime: m.mime, w: m.w, h: m.h }, payload };
  return { header: { k: 'voice', id: m.id, ts: m.ts, mime: m.mime, dur: m.dur }, payload };
}

  const e = readyConn(m.peer); if (!e) { connectTo(m.peer, true); return false; }
  try { const f = await buildFrame(m); await sendEnc(e, f.header, f.payload); return true; } catch (err) { console.warn('deliver', err); return false; }
}

  const ms = (await DB.msgs(peer)).filter(m => m.dir === 'out' && m.status === 'pending');
  for (const m of ms) { if (!(await deliver(m))) break; }

async function prepareImage(file) {
  let src, w, h_;
  try { const bmp = await createImageBitmap(file); src = bmp; w = bmp.width; h_ = bmp.height; }
  catch { src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = src.naturalWidth; h_ = src.naturalHeight; }
  const render = async (maxDim, mime, q) => {
    const sc = Math.min(1, maxDim / Math.max(w, h_)); const cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h_ * sc));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch; const ctx = c.getContext('2d');

    c.localFp = sdpFp(pc.localDescription && pc.localDescription.sdp); c.remoteFp = sdpFp(pc.remoteDescription && pc.remoteDescription.sdp);
    const e = readyConn(c.peer); if (e && c.localFp) sendEnc(e, { k: 'call-fp', callId: c.id, fp: c.localFp }).catch(() => {});
  } catch {}
  checkFp(c); c.timers.fp = setTimeout(() => { if (S.call === c && c.verified === null) setLock(c, false); }, 10000);
}
function checkFp(c) {
  if (c.verified !== null || !c.peerFp || !c.remoteFp) return;
  if (c.peerFp === c.remoteFp) { c.verified = true; setLock(c, true); }
  else { c.verified = false; toast('Call ended: could not verify encryption (possible interception).', 'error'); endCall('failed'); }
}
async function acceptCall() {
  const c = S.call; if (!c || c.state !== 'ringing') return;
  stopRing(); clearTimeout(c.timers.ring); hideIncoming(); c.state = 'connecting';
  const e = readyConn(c.peer);
  try { c.local = await getMedia(c.video); }
  catch (err) { toast(mediaErr(err), 'error'); if (e) sendEnc(e, { k: 'call-decline', callId: c.id }).catch(() => {}); finishCall(c, 'declined'); return; }
  if (!e) { finishCall(c, 'failed'); return; }
  showCallUI();
  try { await sendEnc(e, { k: 'call-accept', callId: c.id }); } catch { finishCall(c, 'failed'); return; }
  c.timers.conn = setTimeout(() => { if (S.call === c && c.state !== 'active') endCall('failed'); }, 20000);
}
function declineCall() {
  const c = S.call; if (!c || c.state !== 'ringing') return;
  const e = readyConn(c.peer); if (e) sendEnc(e, { k: 'call-decline', callId: c.id }).catch(() => {});
  finishCall(c, 'declined');
}
function endCall(reason) {
  const c = S.call; if (!c || c.ended) return;
  const e = readyConn(c.peer); if (e) sendEnc(e, { k: 'call-end', callId: c.id, reason: reason || 'hangup' }).catch(() => {});
  finishCall(c, c.state === 'active' ? 'completed' : (c.state === 'calling' ? 'cancelled' : 'failed'));
}
async function finishCall(c, outcome) {
  if (c.ended) return; c.ended = true;
  const dur = c.startedAt ? Math.round((Date.now() - c.startedAt) / 1000) : 0;
  teardownCall(c); // tear down first so the screen, camera and download popup go away immediately
  if (!c.logged) {
    c.logged = true; const inc = c.dir === 'in', kind = c.video ? 'Video call' : 'Voice call';
    const text = { completed: `${kind} · ${fmtDur(dur)}`, missed: `Missed ${kind.toLowerCase()}`, cancelled: `Cancelled ${kind.toLowerCase()}`, declined: inc ? `Declined ${kind.toLowerCase()}` : 'Call declined', noanswer: 'No answer', busy: 'Busy', failed: 'Call failed' }[outcome] || kind;
    const m = { id: uid(), peer: c.peer, dir: inc ? 'in' : 'out', type: 'call', text, video: c.video, miss: outcome === 'missed' || outcome === 'failed', ts: Date.now(), status: 'delivered' };
    if (S.friends.has(c.peer)) {
      await DB.put('messages', m); if (S.active === c.peer) appendMsg(m);
      const fr = S.friends.get(c.peer); fr.lastTs = m.ts; fr.lastPreview = '📞 ' + text;
      if (outcome === 'missed' && !(S.active === c.peer && !document.hidden)) fr.unread = (fr.unread || 0) + 1;
      await saveFriend(fr);
    }
  }
  if (outcome === 'declined' && c.dir === 'out') toast('Call declined'); else if (outcome === 'busy') toast('They are on another call'); else if (outcome === 'noanswer') toast('No answer');
}
function teardownCall(c) {
  Object.values(c.timers).forEach(t => { clearTimeout(t); clearInterval(t); });
  stopRing(); hidePromo('call');
  try { c.mc && c.mc.close(); } catch {}
  [c.local, c.screenStream].forEach(s => s && s.getTracks().forEach(t => t.stop()));
  try { c.wake && c.wake.release(); } catch {}
  ['remoteVideo', 'remoteBg', 'localVideo'].forEach(id => { const v = $('#' + id); v.srcObject = null; });
  $('#call').classList.remove('on', 'on-ph', 'hide-ui'); hideIncoming();
  clearTimeout(hideTimer);
  if (S.call === c) S.call = null;
}

/* --- call UI --- */
function callAvatar(fr, size) { return avatar(fr, size); }
function showIncoming(c) {
  const fr = S.friends.get(c.peer);
  $('#inAv').replaceChildren(callAvatar(fr, 120)); $('#inName').textContent = dispName(fr);
  $('#inSub').textContent = `Incoming ${c.video ? 'video' : 'voice'} call · encrypted`;
  $('#inAccept').replaceChildren(icon(c.video ? 'video' : 'phone', 30)); $('#inDecline').replaceChildren(icon('phone', 30));
  $('#incoming').classList.add('on');
}
const hideIncoming = () => $('#incoming').classList.remove('on');
$('#inAccept').addEventListener('click', acceptCall); $('#inDecline').addEventListener('click', declineCall);

function showCallUI() {
  const c = S.call, fr = S.friends.get(c.peer);
  $('#call').classList.add('on');
  $('#callAv').replaceChildren(callAvatar(fr, 132)); $('#callName').textContent = dispName(fr); $('#callTitle').textContent = dispName(fr);
  const lv = $('#localVideo');
  lv.srcObject = c.local; lv.play().catch(() => {});
  buildCallBar(); setLock(c, null); setStatus(c); updateCallView(); positionPip(true); armAutoHide();
}
function buildCallBar() {
  const c = S.call; const bar = $('#cbar'); bar.replaceChildren();
  const b = (id, ic, label, fn, cls = '') => h('button', { class: 'cbtn ' + cls, id, title: label, 'aria-label': label, onclick: e => { e.stopPropagation(); fn(); armAutoHide(); } }, icon(ic, 26));
  bar.append(
    b('cMic', 'mic', 'Mute', toggleMic),
    c.video ? b('cCam', 'video', 'Camera', toggleCam) : null,
    c.video ? b('cFlip', 'flip', 'Switch camera', flipCamera) : null,
    c.video && navigator.mediaDevices.getDisplayMedia && !/Android|iPhone|iPad/i.test(navigator.userAgent) ? b('cScr', 'screen', 'Share screen', toggleScreen) : null,
    c.video ? b('cFit', 'expand', 'Fit / fill', cycleFit) : null,
    b('cEnd', 'phone', 'End call', () => endCall('hangup'), 'end'));
}
function setStatus(c, override) {
  const el = $('#callStatus'), sub = $('#callSub');
  let t = override;
  if (!t) t = c.state === 'calling' ? 'Calling…' : c.state === 'ringing' ? 'Ringing…' : c.state === 'connecting' ? 'Connecting…' : fmtDur((Date.now() - c.startedAt) / 1000);
  el.textContent = t; sub.textContent = c.state === 'active' && !c.remoteCam && c.video ? 'Camera off' : t;
}
function setLock(c, ok) {
  const el = $('#callLock');
  if (ok === true) { el.className = 'lk ok'; el.replaceChildren(icon('shield', 14), 'End-to-end encrypted · verified'); }
  else if (ok === false) { el.className = 'lk warn'; el.replaceChildren(icon('lock', 14), 'Encrypted · not verified'); }
  else { el.className = 'lk'; el.replaceChildren(icon('lock', 14), 'End-to-end encrypted'); }
}
function updateCallView() {
  const c = S.call; if (!c) return; const call = $('#call');
  const showRemote = c.state === 'active' && c.video && c.remoteCam && c.remote && c.remote.getVideoTracks().length > 0;
  call.classList.toggle('on-ph', !showRemote);
  $('#remoteVideo').style.visibility = showRemote ? 'visible' : 'hidden'; $('#remoteBg').style.visibility = showRemote ? 'visible' : 'hidden';
  const pip = $('#pip'); const showPip = c.video && (c.cam || c.screen);
  pip.style.display = showPip ? '' : 'none';
  pip.classList.toggle('mirror', c.facing === 'user' && !c.screen);
  const vt = c.local && c.local.getVideoTracks()[0]; const st = vt && vt.getSettings ? vt.getSettings() : {};
  const ar = c.screen ? 16 / 9 : (st.width && st.height ? st.width / st.height : (innerHeight > innerWidth ? 3 / 4 : 4 / 3));
  pip.style.setProperty('--pipar', String(ar));
  pip.style.setProperty('--pipw', (ar >= 1 ? Math.min(180, Math.max(120, innerWidth * 0.22)) : Math.min(132, Math.max(88, innerWidth * 0.26))) + 'px');
  const mic = $('#cMic'), cam = $('#cCam');
  if (mic) { mic.classList.toggle('off', !c.mic); mic.replaceChildren(icon(c.mic ? 'mic' : 'micoff', 26)); }
  if (cam) { cam.classList.toggle('off', !c.cam); cam.replaceChildren(icon(c.cam ? 'video' : 'videooff', 26)); }
  const sub = $('#callSub'); if (c.state === 'active' && c.video && !c.remoteCam) sub.textContent = 'Camera off'; else if (c.state === 'active' && !c.remoteMic) sub.textContent = 'Muted';
  if (c.state === 'active') setTimeout(applyFit, 0);
}
const updateCallUI = () => { const c = S.call; if (c) { setStatus(c); updateCallView(); } };
function toggleMic() { const c = S.call; c.mic = !c.mic; c.local.getAudioTracks().forEach(t => t.enabled = c.mic); pushCallState(); updateCallView(); }
function toggleCam() { const c = S.call; if (c.screen) return; c.cam = !c.cam; c.local.getVideoTracks().forEach(t => t.enabled = c.cam); pushCallState(); updateCallView(); }
function pushCallState() { const c = S.call, e = readyConn(c.peer); if (e) sendEnc(e, { k: 'call-state', callId: c.id, mic: c.mic, cam: c.cam || c.screen }).catch(() => {}); }
function videoSender(c) { const pc = c.mc && c.mc.peerConnection; return pc && pc.getSenders().find(s => (s.track && s.track.kind === 'video') || (s.__v)); }
async function flipCamera() {
  const c = S.call; if (!c || !c.video || c.screen) return;
  const next = c.facing === 'user' ? 'environment' : 'user'; const old = c.local.getVideoTracks()[0]; const sender = videoSender(c);
  if (old) { old.stop(); c.local.removeTrack(old); }
  let ns;
  try { ns = await getMedia(true, next); c.facing = next; }
  catch { try { ns = await getMedia(true, c.facing); } catch (err) { toast(mediaErr(err), 'error'); return; } toast('Could not switch camera', 'error'); }
  const nt = ns.getVideoTracks()[0]; nt.enabled = c.cam; ns.getAudioTracks().forEach(t => t.stop());
  c.local.addTrack(nt); if (sender) { sender.__v = true; await sender.replaceTrack(nt).catch(() => {}); }
  $('#localVideo').srcObject = c.local; updateCallView();
}
async function toggleScreen() {
  const c = S.call; if (!c) return;
  if (c.screen) return stopScreen();
  try {
    const ds = await navigator.mediaDevices.getDisplayMedia({ video: true }); const st = ds.getVideoTracks()[0]; const sender = videoSender(c); if (!sender) { ds.getTracks().forEach(t => t.stop()); return; }
    sender.__v = true; await sender.replaceTrack(st); c.screenStream = ds; c.screen = true; st.onended = stopScreen;
    $('#localVideo').srcObject = ds; pushCallState(); updateCallView();
  } catch {}
}
async function stopScreen() {
  const c = S.call; if (!c || !c.screen) return; c.screen = false;
  if (c.screenStream) { c.screenStream.getTracks().forEach(t => t.stop()); c.screenStream = null; }
  const cam = c.local.getVideoTracks()[0]; const sender = videoSender(c); if (sender && cam) await sender.replaceTrack(cam).catch(() => {});
  $('#localVideo').srcObject = c.local; pushCallState(); updateCallView();
}

/* Adaptive video fit — never over-zoomed, never a tiny letterbox:
   • aspect close to the screen → fill (cover)
   • very different aspect     → fit (contain) over a blurred copy of the video
   The user can override with the expand button (auto → fill → fit). */
function applyFit() {
  const v = $('#remoteVideo'), st = $('#stage'); if (!v.videoWidth || !st.clientHeight) return;
  const ra = v.videoWidth / v.videoHeight, ca = st.clientWidth / st.clientHeight;
  const fill = S.fitMode === 'fill' ? true : S.fitMode === 'fit' ? false : Math.abs(Math.log(ra / ca)) < 0.32;
  v.classList.toggle('fill', fill); $('#remoteBg').style.display = fill ? 'none' : '';
}
function cycleFit() { const order = ['auto', 'fill', 'fit']; S.fitMode = order[(order.indexOf(S.fitMode) + 1) % 3]; applyFit(); toast({ auto: 'Video: auto fit', fill: 'Video: fill screen', fit: 'Video: show full frame' }[S.fitMode]); }
['loadedmetadata', 'resize'].forEach(ev => $('#remoteVideo').addEventListener(ev, applyFit));
addEventListener('resize', () => { applyFit(); if (S.call) { updateCallView(); positionPip(false); } });
addEventListener('orientationchange', () => setTimeout(() => { applyFit(); positionPip(true); }, 300));

/* draggable, corner-snapping picture-in-picture */
let pipCorner = 'tr';
function positionPip(reset) {
  const pip = $('#pip'), stage = $('#stage'); if (!pip) return; if (reset) pipCorner = 'tr';
  const W = stage.clientWidth, H = stage.clientHeight, pw = pip.offsetWidth, ph = pip.offsetHeight, m = 12;
  const top = 78, bottom = 110;
  const x = pipCorner.includes('l') ? m : W - pw - m; const y = pipCorner.includes('t') ? top : H - ph - bottom - 14;
  pip.style.left = Math.max(m, x) + 'px'; pip.style.top = Math.max(m, y) + 'px';
}
(function pipDrag() {
  const pip = $('#pip'); let sx, sy, ox, oy, moved = false, id = null;
  pip.addEventListener('pointerdown', e => { id = e.pointerId; pip.setPointerCapture(id); sx = e.clientX; sy = e.clientY; ox = pip.offsetLeft; oy = pip.offsetTop; moved = false; pip.classList.add('drag'); });
  pip.addEventListener('pointermove', e => { if (id !== e.pointerId) return; const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) + Math.abs(dy) > 4) moved = true; pip.style.left = ox + dx + 'px'; pip.style.top = oy + dy + 'px'; });
  const end = e => {
    if (id !== e.pointerId) return; id = null; pip.classList.remove('drag');
    if (!moved) return; const st = $('#stage'); const cx = pip.offsetLeft + pip.offsetWidth / 2, cy = pip.offsetTop + pip.offsetHeight / 2;
    pipCorner = (cy < st.clientHeight / 2 ? 't' : 'b') + (cx < st.clientWidth / 2 ? 'l' : 'r'); positionPip(false);
  };
  pip.addEventListener('pointerup', end); pip.addEventListener('pointercancel', end);
  pip.addEventListener('click', e => e.stopPropagation());
})();
/* tap the video to show/hide controls */
let hideTimer = null;
function armAutoHide() { const call = $('#call'); call.classList.remove('hide-ui'); clearTimeout(hideTimer); const c = S.call; if (c && c.state === 'active' && c.video) hideTimer = setTimeout(() => call.classList.add('hide-ui'), 4500); }
$('#stage').addEventListener('click', () => { const call = $('#call'), c = S.call; if (!c || !c.video || c.state !== 'active') return; if (call.classList.contains('hide-ui')) armAutoHide(); else { call.classList.add('hide-ui'); clearTimeout(hideTimer); } });

/* ============================== onboarding ============================== */
function storeIdentity() { const k = JSON.parse(localStorage.getItem('hl.key') || '{}'); k.name = S.me.name; localStorage.setItem('hl.key', JSON.stringify(k)); }
function showWelcome() {
  $('#app').hidden = true; const w = $('#welcome'); w.hidden = false; w.replaceChildren(h('div', { class: 'wcard' },
    h('div', { class: 'logo' }, icon('logo', 46)), h('h1', {}, APP_NAME), h('p', { class: 'tagline' }, 'Private chats and calls. No phone number. No email. No tracking.'),
    h('button', { class: 'btn primary block', onclick: createAccountStep }, 'Create account'),
    h('button', { class: 'btn block', onclick: restoreStep }, 'Restore from recovery key'),
    apkCard(),
    h('div', { class: 'feat' }, ['End-to-end encrypted', 'Voice & video calls', 'Photos & voice notes', 'History stays on your device'].map(t => h('span', {}, icon('check', 14), t)))));
}
async function createAccountStep() {
  const w = $('#welcome'); const k = await newIdentity(); const keys = await loadIdentityKeys(k);
  const inp = h('input', { class: 'inp', placeholder: 'Display name', maxlength: 40, style: 'text-align:center;font-size:17px' });
  const go = async () => {
    const name = inp.value.trim().slice(0, 40); if (!name) { inp.focus(); return; }
    localStorage.setItem('hl.key', JSON.stringify({ d: k.d, x: k.x, y: k.y, name })); await beginSession(keys, name);
  };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  w.replaceChildren(h('div', { class: 'wcard' }, h('div', { class: 'logo' }, icon('shield', 44)), h('h1', {}, 'Your new ID'),
    h('p', { class: 'tagline', style: 'margin-bottom:6px' }, 'This is how friends find you. It was created on this device — nobody else has the key.'),
    h('div', { class: 'idbox mono' }, keys.id), h('label', { style: 'display:block;text-align:left;font-size:12.5px;font-weight:650;color:var(--dim);margin:14px 0 6px' }, 'Choose a display name'), inp,
    h('button', { class: 'btn primary block', onclick: go, style: 'margin-top:14px' }, 'Continue'), h('button', { class: 'btn block', onclick: showWelcome }, 'Back')));
  setTimeout(() => inp.focus(), 60);
}
function restoreStep() {
  const w = $('#welcome'); const ta = h('textarea', { class: 'inp mono', rows: 4, placeholder: 'HL1-…', spellcheck: 'false' });
  const nm = h('input', { class: 'inp', placeholder: 'Display name', maxlength: 40 });
  const go = async () => {
    try {
      const s = ta.value.trim(); if (!s.startsWith('HL1-')) throw 0; const k = JSON.parse(td.decode(unb64u(s.slice(4)))); const keys = await loadIdentityKeys(k);
      const name = nm.value.trim().slice(0, 40) || 'Me'; localStorage.setItem('hl.key', JSON.stringify({ d: k.d, x: k.x, y: k.y, name })); await beginSession(keys, name);
    } catch { toast('That recovery key is not valid', 'error'); }
  };
  w.replaceChildren(h('div', { class: 'wcard' }, h('div', { class: 'logo' }, icon('key', 44)), h('h1', {}, 'Restore account'), h('p', { class: 'tagline' }, 'Paste your recovery key to get your ID back.'),
    ta, h('div', { style: 'height:10px' }), nm, h('button', { class: 'btn primary block', onclick: go, style: 'margin-top:14px' }, 'Restore'), h('button', { class: 'btn block', onclick: showWelcome }, 'Back')));
}
async function beginSession(keys, name) {
  S.me = { id: keys.id, priv: keys.priv, pubRaw: keys.pubRaw, name };
  $('#welcome').hidden = true; $('#app').hidden = false;
  (await DB.all('friends')).forEach(f => S.friends.set(f.id, f));
  buildChatPane(); buildPanel(); refreshRail(); startPeer();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (S.pendingAdd) { const p = S.pendingAdd; S.pendingAdd = null; setTimeout(() => openAddFriend(p), 300); }
}

/* ============================== boot ============================== */
function syncViewport() { const v = window.visualViewport ? visualViewport.height : innerHeight; document.documentElement.style.setProperty('--app-h', v + 'px'); if (window.scrollY) scrollTo(0, 0); }
syncViewport(); addEventListener('resize', syncViewport); addEventListener('orientationchange', () => setTimeout(syncViewport, 200));
if (window.visualViewport) { visualViewport.addEventListener('resize', syncViewport); visualViewport.addEventListener('scroll', syncViewport); }

$('#imgInput').addEventListener('change', e => { [...e.target.files].forEach(sendImageFile); e.target.value = ''; });
$('#jsonInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importContacts(f); });
document.addEventListener('pointerdown', () => { try { ac(); } catch {} }, { once: true });

(async function boot() {
  loadSettings(); S.settings.themeLight = S.settings.theme === 'light';
  if (!window.crypto || !crypto.subtle) { document.body.innerHTML = '<p style="padding:24px;color:#fff">This app needs a secure context (HTTPS or localhost).</p>'; return; }
  const hm = /#add=([0-9a-fA-F]+)(?:&n=([^&]*))?/.exec(location.hash);
  if (hm) { try { S.pendingAdd = { id: hm[1].toLowerCase(), name: decodeURIComponent(hm[2] || '') }; } catch { S.pendingAdd = { id: hm[1].toLowerCase(), name: '' }; } try { history.replaceState({}, '', location.pathname); } catch {} }
  try { await DB.open(); } catch { document.body.innerHTML = '<p style="padding:24px;color:#fff">Storage is unavailable (private mode?). Please use a normal browser window.</p>'; return; }
  const raw = localStorage.getItem('hl.key');
  if (raw) { try { const k = JSON.parse(raw); const keys = await loadIdentityKeys(k); await beginSession(keys, k.name || 'Me'); return; } catch (e) { console.warn('identity', e); } }
  showWelcome();
})();
})();
</script>
